name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds every exercise and runs its golden-output test inside the nix
      # sandbox, including expected-viz.txt for exercises that draw themselves.
      # This is the same thing `make test` does locally - so CI cannot drift
      # from the developer experience.
      - name: nix flake check
        run: nix flake check -L

      # Belt and braces: prove the dev shell itself still works, since that is
      # what the README tells people to use.
      - name: make test in the dev shell
        run: nix develop --command make test
